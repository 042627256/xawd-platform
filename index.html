<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>X AWD - Gateway Platform</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
    <style>
      :root { --bg-dark: #0f1218; --surface-dark: #181d27; --border-dark: #272f3d; }
      * { box-sizing: border-box; }
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh; background: var(--bg-dark); color: #e5e7eb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
      #root { height: 100%; width: 100%; }
      .app-shell { display: flex; flex-direction: column; height: 100dvh; max-width: 900px; margin: 0 auto; background: var(--surface-dark); border-left: 1px solid var(--border-dark); border-right: 1px solid var(--border-dark); }
      .app-header { background: #131720; border-bottom: 1px solid var(--border-dark); padding: 10px 14px; flex-shrink: 0; }
      .app-toolbar { background: #10141d; border-bottom: 1px solid var(--border-dark); padding: 8px 14px; font-size: 12px; flex-shrink: 0; }
      .app-chat-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      .app-footer { background: #131720; border-top: 1px solid var(--border-dark); padding: 10px 14px; flex-shrink: 0; }
      .chat-bubble { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.5; font-size: 14px; word-break: break-word; }
      .bubble-user { background: #2563eb; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
      .bubble-ai { background: #1f2633; color: #f3f4f6; align-self: flex-start; border: 1px solid var(--border-dark); border-bottom-left-radius: 2px; }
      .chat-textarea { resize: none; background: #11141b !important; color: #fff !important; border: 1px solid var(--border-dark) !important; border-radius: 16px !important; font-size: 14px !important; }
      .chat-textarea:focus { box-shadow: none !important; border-color: #3b82f6 !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
