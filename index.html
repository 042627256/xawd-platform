<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X AWD Command Center</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { background-color: #030712; color: #f3f4f6; padding: 16px; }
    .max-w-6xl { max-width: 1100px; margin: 0 auto; }
    
    header { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 18px 24px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .logo-box { width: 36px; height: 36px; background: linear-gradient(135deg, #10b981, #06b6d4); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #000; font-size: 18px; }
    
    .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 900px) { .grid { grid-template-columns: 5fr 7fr; } }
    
    .card { background: rgba(17, 24, 39, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 20px; margin-bottom: 16px; }
    
    button { cursor: pointer; transition: all 0.2s; border: none; }
    .task-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .task-btn { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 10px; text-align: left; color: #cbd5e1; }
    .task-btn.active { background: rgba(16, 185, 129, 0.15); border-color: #10b981; color: #fff; }
    
    .tier-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 4px 10px; font-size: 11px; color: #94a3b8; }
    .tier-btn.active { background: #fff; color: #000; font-weight: bold; }
    
    .selector-box { width: 100%; background: #0b0f19; border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; padding: 12px 16px; color: #fff; text-align: left; display: flex; justify-content: space-between; align-items: center; }
    
    textarea { width: 100%; background: #080c14; border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; padding: 14px; color: #fff; font-size: 13px; resize: vertical; min-height: 90px; outline: none; }
    textarea:focus { border-color: #10b981; }
    
    .btn-exec { background: linear-gradient(135deg, #10b981, #14b8a6); color: #000; font-weight: bold; border-radius: 10px; padding: 10px 20px; font-size: 12px; }
    
    .console-box { background: #050811; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px; min-height: 240px; font-family: monospace; font-size: 12px; line-height: 1.6; color: #e2e8f0; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
