<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>X AWD Studio — Neural Workspace</title>
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --panel-dark: #111827;
      --border-color: #1f2937;
      --accent-purple: #6366f1;
      --bubble-user: linear-gradient(135deg, #4f46e5, #7c3aed);
      --bubble-bot: #1e293b;
    }
    body {
      background-color: var(--bg-dark);
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      scroll-behavior: smooth;
    }
    .message-bubble {
      max-width: 85%;
      border-radius: 1.25rem;
      padding: 0.85rem 1.15rem;
      margin-bottom: 0.85rem;
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      word-break: break-word;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .message-user {
      background: var(--bubble-user);
      color: #ffffff;
      margin-left: auto;
      border-bottom-right-radius: 0.25rem;
    }
    .message-bot {
      background-color: var(--bubble-bot);
      color: #e2e8f0;
      margin-right: auto;
      border-bottom-left-radius: 0.25rem;
      border: 1px solid var(--border-color);
    }
    .input-bar {
      background-color: var(--panel-dark);
      border-top: 1px solid var(--border-color);
      padding: 0.75rem 1rem;
    }
    .form-control-dark {
      background-color: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      border-radius: 1.5rem;
      padding: 0.6rem 1.2rem;
    }
    .form-control-dark:focus {
      background-color: #1f2937;
      border-color: var(--accent-purple);
      color: #fff;
      box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-dark bg-black px-3 border-bottom border-secondary">
    <a class="navbar-brand d-flex align-items-center gap-2" href="#">
      <span class="badge bg-primary rounded-pill">X AWD</span>
      <small class="text-secondary fw-semibold">Neural Workspace</small>
    </a>
    <div class="d-flex align-items-center gap-2">
      <!-- Selector Engine Mode -->
      <select id="modelSelector" class="form-select form-select-sm bg-dark text-light border-secondary">
        <option value="gemini-3.1-pro" selected>Gemini 3.1 Pro (Deep Core)</option>
        <option value="claude-3.5-sonnet">Claude 3.5 Sonnet (Logic/Canvas)</option>
        <option value="deepseek-r1">DeepSeek R1 (Reasoning)</option>
        <option value="banana-pro">Banana Pro (Image Engine)</option>
        <option value="veo-3.1">Veo 3.1 (Video 30s)</option>
      </select>
      <button class="btn btn-sm btn-outline-light rounded-circle" id="toggleCombo" title="Toggle Consensus Mode">
        <i class="bi bi-diagram-3"></i>
      </button>
    </div>
  </nav>

  <!-- Area Obrolan Chat -->
  <div class="chat-container" id="chatArea">
    <div class="message-bubble message-bot">
      Selamat datang di <strong>X AWD Neural Workspace</strong>. Platform siap menerima instruksi teks, analisis dokumen teknis, dan eksekusi sintesis media.
    </div>
  </div>

  <!-- Hidden File Pickers (Pemisahan Tegas Galeri vs Dokumen) -->
  <input type="file" id="filePickerDoc" accept=".pdf,.doc,.docx,.txt,.csv,.json,.zip" class="d-none">
  <input type="file" id="filePickerMedia" accept="image/*" capture="environment" class="d-none">

  <!-- Action Sheet Bottom Menu Modal -->
  <div class="modal fade" id="actionModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content bg-dark text-white border-secondary">
        <div class="modal-header border-secondary py-2">
          <h6 class="modal-title font-monospace">Lampirkan Berkas</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-2 d-grid gap-2">
          <button class="btn btn-outline-light text-start py-2" id="btnUploadDoc">
            <i class="bi bi-file-earmark-text text-primary me-2"></i> Dokumen &amp; Arsip (PDF, ZIP, TXT)
          </button>
          <button class="btn btn-outline-light text-start py-2" id="btnUploadImage">
            <i class="bi bi-camera text-success me-2"></i> Kamera / Foto Langsung (Multimodal)
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Interactive Input Bar -->
  <div class="input-bar">
    <form id="chatForm" class="d-flex align-items-center gap-2">
      <button type="button" class="btn btn-dark rounded-circle text-secondary" data-bs-toggle="modal" data-bs-target="#actionModal">
        <i class="bi bi-plus-lg fs-5"></i>
      </button>
      <input type="text" id="userInput" class="form-control form-control-dark" placeholder="Ketik instruksi, /image, atau /video..." autocomplete="off" required>
      <button type="submit" class="btn btn-primary rounded-circle" id="btnSend">
        <i class="bi bi-arrow-up"></i>
      </button>
    </form>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const chatArea = document.getElementById('chatArea');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const modelSelector = document.getElementById('modelSelector');
    const toggleCombo = document.getElementById('toggleCombo');
    let isComboActive = false;

    // Toggle Mode Konsensus Trio
    toggleCombo.addEventListener('click', () => {
      isComboActive = !isComboActive;
      toggleCombo.classList.toggle('btn-primary', isComboActive);
      toggleCombo.classList.toggle('btn-outline-light', !isComboActive);
    });

    // Delegasi Pemilih Berkas (Menghindari Pembukaan Galeri Otomatis pada Dokumen)
    document.getElementById('btnUploadDoc').addEventListener('click', () => {
      bootstrap.Modal.getInstance(document.getElementById('actionModal')).hide();
      document.getElementById('filePickerDoc').click();
    });

    document.getElementById('btnUploadImage').addEventListener('click', () => {
      bootstrap.Modal.getInstance(document.getElementById('actionModal')).hide();
      document.getElementById('filePickerMedia').click();
    });

    document.getElementById('filePickerDoc').addEventListener('change', (e) => {
      if (e.target.files[0]) {
        appendBubble('user', `📄 [Dokumen Terlampir]: ${e.target.files[0].name}`);
      }
    });

    document.getElementById('filePickerMedia').addEventListener('change', (e) => {
      if (e.target.files[0]) {
        appendBubble('user', `📷 [Citra Multimodal Terlampir]: ${e.target.files[0].name}`);
      }
    });

    function appendBubble(sender, text) {
      const bubble = document.createElement('div');
      bubble.className = `message-bubble message-${sender}`;
      bubble.innerHTML = text.replace(/\n/g, '<br>');
      chatArea.appendChild(bubble);
      chatArea.scrollTop = chatArea.scrollHeight;
      return bubble;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = userInput.value.trim();
      if (!prompt) return;

      appendBubble('user', prompt);
      userInput.value = '';

      const botBubble = appendBubble('bot', '<span class="spinner-grow spinner-grow-sm text-secondary"></span> Memproses instruksi...');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: prompt,
            model: modelSelector.value,
            isCombo: isComboActive
          })
        });

        const data = await response.json();
        botBubble.innerHTML = data.content.replace(/\n/g, '<br>');
      } catch (err) {
        botBubble.innerHTML = 'Koneksi jaringan komputasi sedang diarahkan. Silakan kirim ulang pesan Anda.';
      }
    });
  </script>
</body>
</html>
